<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css">
    <link rel="stylesheet" href="../css/index.css">
    <title>Inventario</title>
</head>

<body>
    <div class="container">
        <p class="title is-3 has-text-centered">Registrar Inventario</p>
        <hr class="has-background-primary-light">



        <div class="field">
            <label class="label">Categoria Producto</label>
            <div class="control">
                <div class="select">
                    <select id="categoria">
                        <option selected>Seleccione una Categoria</option>
                        <option value="Alimentos">Alimentos </option>
                        <option value="bebidas">Bebidas</option>
                        <option value="Limpieza">Limpieza</option>
                        <option value="Higiene_Personal">Higiene Personal</option>
                        <option value="otros">Otros</option>
                    </select>
                </div>
            </div>
        </div>


        <div class="field">
            <label class="label">Codigo Producto</label>
            <div class="control">
                <input id="codigo_producto" class="input has-background-primary-light" type="text"
                    placeholder="Ingrese el codigo del producto">
            </div>
        </div>
        <div class="field">
            <label class="label">Nombre Producto</label>
            <div class="control">
                <input id="nombre_producto" class="input has-background-primary-light" type="text"
                    placeholder="Ingrese el nombre del producto">
            </div>
        </div>

        <div class="field">
            <label class="label">Descripcion Producto</label>
            <div class="control">
                <input id="descripcion_producto" class="input has-background-primary-light" type="text"
                    placeholder="Ingrese la descripcion del producto">
            </div>
        </div>
        <div class="field"></div>
        <label class="label">Precio Unitario</label>
        <div class="control">
            <input id="precio_unitario" class="input has-background-primary-light" type="text"
                placeholder="Ingrese el precio unitario del producto">
        </div>
        <div class="field">
            <label class="label">Proveedor</label>
            <div class="control">
                <input id="proveedor" class="input has-background-primary-light" type="text"
                    placeholder="Ingrese el proveedor del producto">
            </div>
        </div>



        <hr class="has-background-primary-light">

        <div class="field is-grouped is-justify-content-center">
            <div class="control">
                <button id="enviar" class="button has-background-success-light">
                    Enviar
                </button>
            </div>
            <div class="control">
                <a href="../index.html" class="button has-background-danger-light">
                    Cancelar
                </a>
            </div>
        </div>
    </div>
</body>

</html>
