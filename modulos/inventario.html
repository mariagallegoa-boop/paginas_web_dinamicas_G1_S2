<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css">
    <link rel="stylesheet" href="../css/index.css">
    <title>Inventario</title>
</head>

<body>
    <div class="container">
        <p class="title is-3 has-text-centered">Registrar Inventario</p>
        <hr class="has-background-primary-light">

        <div class="field">
            <label class="label">Nombre</label>
            <div class="control">
                <input id="nombre" class="input has-background-primary-light" type="text"
                    placeholder="Ingrese su Nombre">
            </div>
        </div>

        <div class="field">
            <label class="label">Apellidos</label>
            <div class="control">
                <input id="apellidos" class="input has-background-primary-light" type="text"
                    placeholder="Ingrese su Apellido">
            </div>
        </div>

        <div class="field">
            <label class="label">Tipo de Documento</label>
            <div class="control">
                <div class="select">
                    <select id="tipo_documento">
                        <option selected>Seleccione un tipo de Documento</option>
                        <option value="Tarjeta_Identidad">Tarjeta de Identidad</option>
                        <option value="Cedula_Ciudadania">cedula de CUidadania</option>
                        <option value="Pasaporte">Pasaporte</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="field">
            <label class="label">Numero de Documento</label>
            <div class="control">
                <input id="numero_documento" class="input has-background-warning-light" type="int"
                    placeholder="Ingrese su Numero de Documento">
            </div>
        </div>

        <div class="field">
            <div class="control">
                <label class="label">Genero</label>
                <label class="radio">
                    <input type="radio" name="genero" value="Femenino">
                    Femenino
                </label>
                <label class="radio">
                    <input type="radio" name="genero" value="Masculino">
                    Masculino
                </label>
            </div>
        </div>


        <div class="field">
            <label class="label">Colegio</label>
            <div class="control">
                <div class="select">
                    <select id="colegio">
                        <option selected>Seleccione un Colegio</option>
                        <option value="San_Jorge">San jorge</option>
                        <option value="Santo_Domingo">Santo Domingo</option>
                        <option value="Estambul">Estambul</option>
                        <option value="La_Sultana">La sultana</option>
                        <option value="Malhabar">Malhabar</option>
                    </select>
                </div>
            </div>
        </div>


        <div class="field">
            <label class="label">Correo Institucional</label>
            <div class="control">
                <input id="correo_institucional" class="input has-background-primary-light" type="email"
                    placeholder="Ingrese su Correo Institucional">
            </div>
        </div>

        <div class="field">
            <label class="label">Fecha Nacimiento</label>
            <div class="control">
                <input id="fecha_nacimiento" class="input has-background-primary-light" type="date"
                    placeholder="Ingrese su Fecha de Nacimiento">
            </div>
        </div>

        <div class="field">
            <label class="label">Numero de Telefono</label>
            <div class="control">
                <input id="numero_telefono" class="input has-background-primary-light" type="tel"
                    placeholder="Ingrese su Numero de Telefono">
            </div>
        </div>

        <div class="field">
            <label class="label">Dirreccion</label>
            <div class="control">
                <input id="direccion" class="input has-background-primary-light" type="text"
                    placeholder="Ingrese su Direccion">
            </div>
        </div>


        <div class="field">
            <label class="label">Tipo de Sangre</label>
            <div class="control">
                <div class="select">
                    <select id="tipo_sangre">
                        <option selected>Seleccione un Tipo de Sangre</option>
                        <option value="O+">O+</option>
                        <option value="O-">O-</option>
                        <option value="A+">A+</option>
                        <option value="A-">A-</option>
                        <option value="AB+">AB+</option>
                        <option value="AB-">AB-</option>
                    </select>
                </div>
            </div>
        </div>

        <hr class="has-background-primary-light">

        <div class="field is-grouped is-justify-content-center">
            <div class="control">
                <button id="enviar" class="button has-background-success-light">
                    Enviar
                </button>
            </div>
            <div class="control">
                <a href="../index.html" class="button has-background-danger-light">
                    Cancelar
                </a>
            </div>
        </div>
    </div>
</body>

</html>
